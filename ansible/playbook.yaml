---
- name: Configure Kali VPS
  hosts: kali
  become: true
  gather_facts: true

  vars:
    lab_user: "{{ hostvars[inventory_hostname]['lab_username'] | default('lab', true) }}"

  # One apt-cache policy for the whole play, instead of repeating
  # update_cache/cache_valid_time on every apt task. Tasks that need a forced
  # refresh override cache_valid_time: 0 (see kali_mullvad).
  module_defaults:
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600

  roles:
    - { role: common, tags: [common, base] }
    - { role: wireguard_server, tags: [wireguard, wg, network] }
    - { role: persistence, tags: [persistence, home] }
    - role: kali_desktop
      tags: [desktop, gui, xrdp]
      when: (kali_gui | default('xfce')) != 'none'
    - { role: kali_mullvad, tags: [mullvad, vpn] }
    - { role: kali_toolset, tags: [toolset, tools] }

  post_tasks:
    - name: Show the server public key (paste into the Mac peer config)
      ansible.builtin.debug:
        msg: "WireGuard server public key: {{ wireguard_server_pub.stdout | trim }}"
