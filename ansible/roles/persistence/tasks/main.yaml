---
# Persistent /home on the attached Hetzner volume. Seed-then-mount: copy the
# existing /home (including ~/.ssh/authorized_keys) onto the volume BEFORE
# mounting it, or the mount would bury the key and lock the box out.
- name: Assert the data volume device was provided
  ansible.builtin.assert:
    that:
      - data_volume_device is defined
      - data_volume_device | length > 0
    fail_msg: "data_volume_device is empty; check the Tofu output and inventory."

- name: Check whether /home is already its own mount
  ansible.builtin.command: findmnt -no SOURCE /home
  register: persistence_home_src
  changed_when: false
  failed_when: false

- name: Detect the volume's current filesystem (if any)
  ansible.builtin.command: "blkid -o value -s TYPE {{ data_volume_device }}"
  register: persistence_vol_fstype
  changed_when: false
  failed_when: false

- name: Format the volume ext4 with label KALIHOME on first use
  ansible.builtin.command: "mkfs.ext4 -L KALIHOME {{ data_volume_device }}"
  when:
    - (persistence_home_src.stdout | trim) | length == 0
    - (persistence_vol_fstype.stdout | trim) | length == 0
  changed_when: true

- name: Seed the volume from the current /home before mounting
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      mkdir -p /mnt/newhome
      mount {{ data_volume_device }} /mnt/newhome
      trap 'umount /mnt/newhome' EXIT
      if [ ! -d "/mnt/newhome/{{ lab_user }}" ]; then
        tar -C /home --one-file-system -cf - . | tar -C /mnt/newhome -xpf -
      fi
    executable: /bin/bash
  when: (persistence_home_src.stdout | trim) | length == 0
  changed_when: true

- name: Ensure the volume carries the KALIHOME label
  # The label has been observed to go missing on an already-formatted,
  # already-seeded volume (root cause unconfirmed) leaving /dev/disk/by-label/
  # empty, which stalls home.mount (and every login whose $HOME is under
  # /home) waiting on a device that never appears. e2label is idempotent and
  # safe to re-run every time regardless of cause.
  ansible.builtin.command: "e2label {{ data_volume_device }} KALIHOME"
  changed_when: false

- name: Add the fstab entry for /home keyed by LABEL
  ansible.posix.mount:
    path: /home
    src: LABEL=KALIHOME
    fstype: ext4
    opts: defaults,nofail
    state: mounted
