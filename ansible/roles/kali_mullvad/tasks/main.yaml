---
# Mullvad VPN app and Mullvad Browser, behind a single toggle. Kali packages
# neither, so the third-party repo is what keeps both current with the box's
# normal apt upgrade.
#
# kali_mullvad false is a real removal, not a skip: packages purged,
# repository and key taken back out.
#
# Unlike a locally-hosted VM where the operator reaches the guest over a
# local range Mullvad's "allow LAN" already exempts, this box is managed
# over its public IP. Mullvad's kill switch would otherwise cut off the SSH
# and WireGuard access used to manage it the moment someone runs
# `mullvad connect`. Persistent nftables rules (Mullvad's own documented
# technique) exempt those two ports from tunnel enforcement, installed
# whenever Mullvad is, independent of connection state, and before anyone
# ever connects.

- name: Read the guest's dpkg architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: kali_mullvad_arch
  changed_when: false

# Stable Mullvad Browser is amd64 only (it is built on Tor Browser, which has
# no stable Linux aarch64 release); arm64 only gets the alpha channel, as a
# separate package. The VPN app itself ships arm64 as a normal stable build.
- name: Pick the Mullvad Browser package for this architecture
  ansible.builtin.set_fact:
    kali_mullvad_browser_pkg: >-
      {{ 'mullvad-browser' if (kali_mullvad_arch.stdout | trim) == 'amd64'
         else 'mullvad-browser-alpha' }}

# --- Management-access exclusion (SSH + WireGuard) --------------------------
# Applied whenever kali_mullvad is true, regardless of whether Mullvad is
# actually connected -- it has to exist before the first `mullvad connect`.

- name: Ensure nftables is installed
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: kali_mullvad | bool

- name: Install nftables rules exempting SSH and WireGuard from Mullvad's tunnel
  ansible.builtin.template:
    src: exclude-mullvad.nft.j2
    dest: /etc/nftables-mullvad-exclude.conf
    owner: root
    group: root
    mode: "0644"
  when: kali_mullvad | bool
  register: kali_mullvad_exclude_conf

- name: Apply the exclusion rules now
  ansible.builtin.command:
    cmd: nft -f /etc/nftables-mullvad-exclude.conf
  changed_when: true
  when:
    - kali_mullvad | bool
    - kali_mullvad_exclude_conf.changed

- name: Install a systemd unit to reapply the exclusion rules on every boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/mullvad-exclude.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Exempt SSH/WireGuard from Mullvad's tunnel enforcement
      Before=mullvad-daemon.service
      ConditionPathExists=/etc/nftables-mullvad-exclude.conf

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/nft -f /etc/nftables-mullvad-exclude.conf

      [Install]
      WantedBy=multi-user.target
  when: kali_mullvad | bool
  register: kali_mullvad_exclude_unit

- name: Enable the exclusion unit
  ansible.builtin.systemd:
    name: mullvad-exclude.service
    enabled: true
    daemon_reload: "{{ kali_mullvad_exclude_unit.changed | default(false) }}"
  when: kali_mullvad | bool

# --- Install ----------------------------------------------------------------
- name: Install the Mullvad repository signing key
  ansible.builtin.get_url:
    url: https://repository.mullvad.net/deb/mullvad-keyring.asc
    dest: /usr/share/keyrings/mullvad-keyring.asc
    owner: root
    group: root
    mode: "0644"
  when: kali_mullvad | bool

# The suite is spelled out rather than taken from `lsb_release -cs`: on Kali
# that answers "kali-rolling", which this repository has no suite for, and
# apt would fail on every update from then on.
- name: Add the Mullvad apt repository
  ansible.builtin.apt_repository:
    filename: mullvad
    repo: >-
      deb [signed-by=/usr/share/keyrings/mullvad-keyring.asc arch={{ kali_mullvad_arch.stdout | trim }}]
      https://repository.mullvad.net/deb/stable stable main
    state: present
    update_cache: true
  when: kali_mullvad | bool

# The browser has no headless use, so it only follows when there is a desktop.
# The VPN is useful either way: the `mullvad` CLI drives the same daemon.
- name: Install the Mullvad VPN app and Mullvad Browser
  ansible.builtin.apt:
    name: >-
      {{ ['mullvad-vpn']
         + ([kali_mullvad_browser_pkg] if (kali_gui | default('xfce')) != 'none' else []) }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: kali_mullvad | bool

# The postinst does this already; stated so a daemon disabled by hand comes
# back on the next configure run.
- name: Enable the Mullvad daemon
  ansible.builtin.systemd:
    name: mullvad-daemon
    enabled: true
    state: started
  when: kali_mullvad | bool

# --- Removal ----------------------------------------------------------------
# Packages first: dropping the sources file would take their origin away
# while they are still installed.
- name: Purge the Mullvad packages
  ansible.builtin.apt:
    name:
      - mullvad-vpn
      - mullvad-browser
      - mullvad-browser-alpha
    state: absent
    purge: true
  when: not (kali_mullvad | bool)

- name: Remove the Mullvad repository and key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/mullvad.list
    - /usr/share/keyrings/mullvad-keyring.asc
  register: kali_mullvad_repo_removed
  when: not (kali_mullvad | bool)

- name: Refresh the apt cache without the Mullvad repository
  ansible.builtin.apt:
    update_cache: true
  when:
    - not (kali_mullvad | bool)
    - kali_mullvad_repo_removed.changed

- name: Disable the exclusion unit
  ansible.builtin.systemd:
    name: mullvad-exclude.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (kali_mullvad | bool)

- name: Remove the exclusion unit and ruleset file
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/mullvad-exclude.service
    - /etc/nftables-mullvad-exclude.conf
  when: not (kali_mullvad | bool)
