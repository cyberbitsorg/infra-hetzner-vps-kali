---
# Cache freshness is the play's module_defaults policy (update_cache with a
# 3600s window); the first install task picks it up.
- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - fail2ban
      - curl
      - ca-certificates
      - htop
      - vim
    state: present

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Enable a fail2ban sshd jail (backstop for public key-only SSH)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      bantime = 1h
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
