---
# Cache freshness is the play's module_defaults policy (update_cache with a
# 3600s window); the first install task picks it up.
- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - fail2ban
      - curl
      - ca-certificates
      - htop
      - vim
    state: present

# Shipped by the Kali GenericCloud image: a skeleton home for its default
# user (never created here -- our users: override replaces it) and a sudoers
# stub for a group with no members. Left in place they clutter /home and get
# seeded onto the persistent volume; drop both on every run.
- name: Remove leftover Kali image artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/kali
    - /etc/sudoers.d/kali-grant-root

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Enable a fail2ban sshd jail (backstop for public key-only SSH)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      bantime = 1h
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
